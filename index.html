<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON VIOLET | Instrument Cluster HUD</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main id="cockpit" class="theme-violet engine-off hp-high" aria-label="Vehicle HUD">

    <!-- PENGATURAN HUD & DUAL-MODE MUSIC PLAYER -->
    <div id="settingsMenu">
      <div class="settings-heading">
        <span class="settings-dot"></span>
        <span>CLUSTER CONFIG</span>
        <button id="closeSettings" class="icon-button" type="button" aria-label="Tutup pengaturan">×</button>
      </div>

      <div class="menu-btns">
        <button type="button" data-act="resize">Resize</button>
        <button type="button" data-act="move">Pindah</button>
        <button type="button" data-act="reset">Reset</button>
        <button type="button" data-act="theme">Theme</button>
      </div>

      <!-- PANEL DUAL-MODE AUDIO (RADIO FM & YOUTUBE) -->
      <section id="music-panel" class="music-panel no-drag" aria-label="Dual Mode Audio Player">
        <div class="audio-tabs" role="tablist">
          <button id="tabBtnRadio" class="audio-tab active" type="button" data-tab="radio" role="tab" aria-selected="true">
            📻 Radio FM
          </button>
          <button id="tabBtnYoutube" class="audio-tab" type="button" data-tab="youtube" role="tab" aria-selected="false">
            ▶ YouTube
          </button>
        </div>

        <!-- TAB 1: LIVE RADIO FM STREAMING -->
        <div id="tabContentRadio" class="audio-tab-pane active" role="tabpanel">
          <div class="radio-display">
            <div class="radio-badge">LIVE FM</div>
            <div class="radio-meta">
              <div id="stationName" class="radio-station-name">Delta FM</div>
              <div id="radioStatus" class="radio-status-text">Stopped</div>
            </div>
            <div class="radio-eq" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>

          <div class="radio-select-wrap">
            <select id="stationSelect" class="radio-select" aria-label="Pilih Stasiun Radio"></select>
          </div>

          <div class="music-main-controls">
            <button id="btn-radio-prev" class="music-control-btn" type="button" title="Stasiun Sebelumnya">⏮</button>
            <button id="btn-radio-play" class="music-play-btn" type="button" title="Play / Pause Radio">▶</button>
            <button id="btn-radio-next" class="music-control-btn" type="button" title="Stasiun Berikutnya">⏭</button>
          </div>

          <div class="music-volume-row">
            <button id="btn-radio-mute" class="music-icon-btn" type="button" title="Mute Radio">🔊</button>
            <input id="radio-volume" class="music-range" type="range" min="0" max="100" value="80" step="1" aria-label="Radio Volume">
            <span id="radio-volume-label" class="volume-pct">80%</span>
            <button id="btn-radio-add-toggle" class="music-small-btn music-add-toggle" type="button" title="Tambah saluran radio via link">＋</button>
          </div>

          <div id="radio-add-row" class="music-add-row hide">
            <input id="radio-url-input" type="text" placeholder="Link Stream Radio (http/https)" autocomplete="off">
            <input id="radio-title-input" type="text" placeholder="Nama Radio (opsional)" autocomplete="off">
            <button id="btn-radio-add" class="music-small-btn music-add-primary" type="button" title="Simpan & Putar">▶</button>
          </div>

          <div class="music-playlist-head">
            <span>Saluran Radio</span>
            <button id="btn-radio-clear" class="music-text-btn" type="button" title="Hapus semua radio tambahan">↺</button>
          </div>
          <div id="radio-playlist" class="music-playlist" role="list"></div>
        </div>

        <!-- TAB 2: YOUTUBE LINK & PLAYLIST -->
        <div id="tabContentYoutube" class="audio-tab-pane" role="tabpanel">
          <div class="music-now-playing">
            <div class="music-video-wrap">
              <div id="youtube-player"></div>
              <img id="music-cover" class="music-cover" alt="" aria-hidden="true">
              <div id="music-player-placeholder" class="music-placeholder">
                <span class="music-placeholder-note" aria-label="Music">♪</span>
              </div>
            </div>
            <div class="music-track-meta">
              <div id="music-track-title">Belum ada lagu</div>
              <div id="music-track-subtitle">Online playback</div>
            </div>
          </div>

          <div class="music-progress-row">
            <span id="music-current-time">0:00</span>
            <input id="music-progress" class="music-range" type="range" min="0" max="1000" value="0" step="1" aria-label="Song progress">
            <span id="music-duration">0:00</span>
          </div>

          <div class="music-main-controls">
            <button id="btn-music-prev" class="music-control-btn" type="button" title="Previous">⏮</button>
            <button id="btn-music-play" class="music-play-btn" type="button" title="Play / Pause">▶</button>
            <button id="btn-music-next" class="music-control-btn" type="button" title="Next">⏭</button>
          </div>

          <div class="music-volume-row">
            <button id="btn-music-mute" class="music-icon-btn" type="button" title="Mute">🔊</button>
            <input id="music-volume" class="music-range" type="range" min="0" max="100" value="80" step="1" aria-label="Volume">
            <button id="btn-music-add-toggle" class="music-small-btn music-add-toggle" type="button" title="Tambah lagu">＋</button>
          </div>

          <div id="music-add-row" class="music-add-row hide">
            <input id="music-url-input" type="text" placeholder="Link YouTube / ID Video" autocomplete="off">
            <input id="music-title-input" type="text" placeholder="Nama lagu (opsional)" autocomplete="off">
            <button id="btn-music-add" class="music-small-btn music-add-primary" type="button">▶</button>
          </div>

          <div class="music-tools-row">
            <button id="btn-music-repeat" class="music-tool-btn" type="button" title="Ulangi lagu">↻</button>
            <button id="btn-music-shuffle" class="music-tool-btn" type="button" title="Putar acak">⤨</button>
          </div>

          <div class="music-playlist-head">
            <span>Playlist</span>
            <button id="btn-music-clear" class="music-text-btn" type="button" title="Kosongkan playlist">×</button>
          </div>
          <div id="music-playlist" class="music-playlist" role="list">
            <div class="music-empty">Playlist kosong. Tekan + untuk menambah lagu.</div>
          </div>
        </div>
      </section>

      <div id="settingsHint">Klik kanan untuk menutup menu</div>
      <div class="settings-footer">
        <span>NEON CLUSTER OS</span>
        <span>VIOLET EDITION</span>
      </div>
    </div>

    <!-- FLOATING MINI AUDIO PILL -->
    <div id="mini-music-pill" class="mini-music-pill no-drag" aria-label="Mini Audio Controller">
      <div class="mini-pill-left">
        <span id="miniSourceBadge" class="mini-source-badge">📻 RADIO</span>
        <div id="miniEq" class="mini-eq" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="mini-track-wrap" title="Sedang Diputar">
        <div id="miniTrackTitle" class="mini-track-title">Delta FM</div>
      </div>

      <div class="mini-pill-controls">
        <button id="btn-mini-prev" class="mini-ctrl-btn" type="button" title="Sebelumnya">⏮</button>
        <button id="btn-mini-play" class="mini-ctrl-btn mini-play-toggle" type="button" title="Play / Pause">▶</button>
        <button id="btn-mini-next" class="mini-ctrl-btn" type="button" title="Berikutnya">⏭</button>
        <button id="btn-mini-open" class="mini-ctrl-btn mini-panel-btn" type="button" title="Buka Panel Musik">🎵</button>
        <button id="btn-mini-close" class="mini-ctrl-btn mini-close-btn" type="button" title="Sembunyikan Mini Player">×</button>
      </div>
    </div>

    <!-- ===================== KLASTER INSTRUMEN NEON UNGU ===================== -->
    <div class="cluster">

      <div id="hudNotice" class="hud-notice" role="status" aria-live="polite"></div>

      <div id="alarmBanner" role="status" aria-live="polite">
        <span class="alarm-symbol">⚠</span>
        <span>OVERSPEED // 60+ MPH</span>
      </div>

      <svg id="clusterSvg" viewBox="0 60 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Instrument cluster">
        <defs>
          <filter id="fxGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="fxGlowBig" x="-30%" y="-40%" width="160%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <linearGradient id="gSpeed" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="st-light"/>
            <stop offset="0.55" class="st-light"/>
            <stop offset="1" class="st-main"/>
          </linearGradient>
          <linearGradient id="gFrame" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" class="st-deep"/>
            <stop offset="0.5" class="st-main"/>
            <stop offset="1" class="st-deep"/>
          </linearGradient>
          <radialGradient id="gFace" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#06011a" stop-opacity="0.82"/>
            <stop offset="0.78" stop-color="#0a0424" stop-opacity="0.7"/>
            <stop offset="1" class="st-face-edge"/>
          </radialGradient>
        </defs>

        <!-- ===== GARIS DEKORASI RANGKA ===== -->
        <g class="frame-deco">
          <path class="frame-line" d="M36 136 L74 106 H312 L336 118"/>
          <path class="frame-line" d="M964 136 L926 106 H688 L664 118"/>
          <path class="frame-line thin" d="M60 126 L84 112 H190"/>
          <path class="frame-line thin" d="M940 126 L916 112 H810"/>
          <rect class="accent" x="86" y="103" width="46" height="3" rx="1.5"/>
          <rect class="accent" x="868" y="103" width="46" height="3" rx="1.5"/>
        </g>

        <!-- ===== PANEL SPEED DIGITAL (KIRI ATAS) ===== -->
        <g id="speedPod">
          <path class="panel" d="M62 140 H308 L322 156 V256 L306 268 H40 L30 252 V172 Z"/>
          <path class="panel-edge" d="M70 146 H300"/>
          <path class="panel-edge" d="M44 262 H298"/>
          <text id="speedValue" x="96" y="226" textLength="190" lengthAdjust="spacingAndGlyphs" filter="url(#fxGlowBig)">000</text>
          <text id="speedUnit" x="190" y="252" text-anchor="middle">MPH</text>
        </g>

        <!-- ===== DIAL TACHOMETER (TENGAH) ===== -->
        <g id="dial">
          <circle class="bezel" cx="500" cy="240" r="170" filter="url(#fxGlow)"/>
          <circle class="bezel2" cx="500" cy="240" r="164"/>
          <circle class="face" cx="500" cy="240" r="162"/>

          <path class="ring-track thin" data-ring="500,240,157"/>
          <path id="rpmArc" class="rpm-arc" data-ring-val="500,240,157" filter="url(#fxGlow)"/>
          <path id="redZone" class="red-zone"/>

          <g id="dialTicks"></g>
          <g id="dialNums"></g>

          <circle class="ring-inner" cx="500" cy="240" r="96"/>
          <circle class="ring-dash" cx="500" cy="240" r="90"/>
          <text class="dial-cap" x="500" y="184" text-anchor="middle">x1000</text>
          <text class="dial-cap" x="500" y="198" text-anchor="middle">RPM</text>

          <g id="needle" filter="url(#fxGlow)">
            <path class="needle-body" d="M498.4 190 L500 90 L501.6 190 Z"/>
            <line class="needle-core" x1="500" y1="190" x2="500" y2="96"/>
          </g>

          <circle class="hub" cx="500" cy="240" r="50"/>
          <circle class="hub-ring" cx="500" cy="240" r="45"/>
          <text id="gearValue" x="500" y="241" text-anchor="middle" filter="url(#fxGlow)">N</text>
        </g>

        <!-- ===== POD FUEL (KANAN ATAS) ===== -->
        <g id="fuelPod">
          <path class="panel" d="M700 148 L730 120 H880 L902 148 V232 L876 262 H730 L700 234 Z"/>
          <text class="bar-label" x="727" y="141">F</text>
          <g id="fuelBar" class="seg-bar" data-x="720" data-y="147" data-h="90" data-n="10" data-w="9"></g>
          <text class="bar-label" x="727" y="252">E</text>

          <path class="ring-track" data-ring="815,191,58"/>
          <path id="fuelArc" class="ring-val" data-ring-val="815,191,58" filter="url(#fxGlow)"/>
          <circle class="ring-inner" cx="815" cy="191" r="50"/>
          <circle class="ring-dash" cx="815" cy="191" r="66"/>

          <g class="ico pod-ico" transform="translate(801.2 149) scale(1.15)">
            <path d="M5 21V5.5A1.5 1.5 0 0 1 6.5 4h7A1.5 1.5 0 0 1 15 5.5V21"/>
            <path d="M3.5 21h12"/>
            <path d="M7.5 8.5h5"/>
            <path d="M15 9.5h2a1.5 1.5 0 0 1 1.5 1.5v5.5a1.5 1.5 0 0 0 3 0V9l-2.4-2.6"/>
          </g>
          <text class="pod-label" x="815" y="193" text-anchor="middle">FUEL</text>
          <text id="fuelValue" class="pod-value" x="815" y="219" text-anchor="middle">100%</text>
        </g>

        <!-- ===== POD ENGINE (KANAN BAWAH) ===== -->
        <g id="enginePod">
          <path class="panel" d="M700 306 L730 278 H880 L902 306 V382 L876 410 H730 L700 384 Z"/>
          <text class="bar-label" x="727" y="298">H</text>
          <g id="engineBar" class="seg-bar" data-x="720" data-y="303" data-h="84" data-n="10" data-w="9"></g>
          <text class="bar-label" x="727" y="400">L</text>

          <path class="ring-track" data-ring="815,344,58"/>
          <path id="engineArc" class="ring-val" data-ring-val="815,344,58" filter="url(#fxGlow)"/>
          <circle class="ring-inner" cx="815" cy="344" r="50"/>
          <circle class="ring-dash" cx="815" cy="344" r="66"/>

          <g id="engineCheck" class="vehicle-indicator ico pod-ico" transform="translate(801.2 302) scale(1.15)">
            <path d="M4 9h3l2-3h6l2 3h3v9h-3l-2 2H8l-2-2H4zM9 6V3h5v3M8 12h3m2 0h3"/>
          </g>
          <text class="pod-label" x="815" y="346" text-anchor="middle">ENGINE</text>
          <text id="engineValue" class="pod-value" x="815" y="372" text-anchor="middle">OFF</text>
        </g>

        <!-- ===== POD HEALTH (KIRI BAWAH) ===== -->
        <g id="healthPod">
          <path class="panel" d="M84 306 L112 278 H282 L312 306 V382 L286 410 H112 L84 384 Z"/>
          <text class="bar-label" x="100" y="298">H</text>
          <g id="healthBar" class="seg-bar" data-x="98" data-y="303" data-h="84" data-n="10" data-w="9"></g>
          <text class="bar-label" x="100" y="400">L</text>

          <path class="ring-track" data-ring="212,344,58"/>
          <path id="healthArc" class="ring-val" data-ring-val="212,344,58" filter="url(#fxGlow)"/>
          <circle class="ring-inner" cx="212" cy="344" r="50"/>
          <circle class="ring-dash" cx="212" cy="344" r="66"/>

          <g class="pod-ico heart-ico" transform="translate(198.2 302) scale(1.15)">
            <path class="heart-fill" d="M12 20.5C5 15.8 3 12.4 3 9.2A4.6 4.6 0 0 1 12 7.6 4.6 4.6 0 0 1 21 9.2C21 12.4 19 15.8 12 20.5Z"/>
            <path class="heart-ecg" d="M4.5 12.4h4l1.6-3.2 2.6 6.2 1.8-3h4.5"/>
          </g>
          <text class="pod-label" x="212" y="346" text-anchor="middle">HEALTH</text>
          <text id="healthValue" class="pod-value" x="212" y="372" text-anchor="middle">100%</text>
        </g>

        <!-- ===== BAR BAWAH: DOOR LOCK / SEATBELT / GEAR / SEIN / LAMPU / JAM / ODO ===== -->
        <g id="bottomBar">
          <path class="panel" d="M150 422 H850 L878 440 V468 L850 486 H150 L122 468 V440 Z"/>
          <path class="sep" d="M352 430 L344 478"/>
          <path class="sep" d="M470 430 L462 478"/>
          <path class="sep" d="M650 430 L642 478"/>

          <!-- Door lock -->
          <g id="doorLockIcon" class="vehicle-indicator ico unlocked" transform="translate(158 441) scale(1.05)">
            <path id="lockShackle" d="M7 11V7a5 5 0 0 1 9.9-1"/>
            <rect x="5" y="11" width="14" height="10" rx="2.4"/>
            <circle class="fill-i" cx="12" cy="15.5" r="1.3"/>
          </g>

          <!-- Seatbelt -->
          <g id="seatbeltIndicator" class="vehicle-indicator ico" transform="translate(204 441) scale(1.05)">
            <circle class="fill-i" cx="12" cy="4.6" r="2.4"/>
            <path class="fill-i" d="M7.2 9.4c0-.9.8-1.4 1.8-1.4h6c1 0 1.8.5 1.8 1.4L18 16.5H6z"/>
            <path class="belt-cut" d="M9 8.6l7 8"/>
            <path d="M4.5 20h15"/>
          </g>
          <text class="bar-text" x="240" y="450">SEATBELT</text>
          <g id="beltDashes">
            <rect x="240" y="460" width="14" height="2.4" rx="1.2"/>
            <rect x="258" y="460" width="14" height="2.4" rx="1.2"/>
            <rect x="276" y="460" width="14" height="2.4" rx="1.2"/>
          </g>

          <!-- Gear -->
          <path class="gear-box" d="M386 428 H442 L434 462 H378 Z"/>
          <text id="gearValue2" x="410" y="446" text-anchor="middle">N</text>
          <text class="bar-text small" x="411" y="476" text-anchor="middle">GEAR</text>

          <!-- Sein + lampu -->
          <g id="leftIndicator" class="signal" transform="translate(492 443)">
            <path d="M20 5 H10 V0 L0 8 L10 16 V11 H20 Z"/>
          </g>
          <g id="rightIndicator" class="signal" transform="translate(522 443)">
            <path d="M0 5 H10 V0 L20 8 L10 16 V11 H0 Z"/>
          </g>
          <g id="headlightIndicator" class="vehicle-indicator ico" transform="translate(574 441) scale(1.05)">
            <path d="M4 8h5a5 5 0 0 1 0 10H4zM13 8h7M13 12h8M13 16h7"/>
          </g>

          <!-- Jam + odometer -->
          <text id="clockValue" x="760" y="445" text-anchor="middle">12:59</text>
          <path class="sep flat" d="M676 452 H846"/>
          <text class="odo-tag" x="680" y="472">ODO</text>
          <text id="odometerValue" x="752" y="472" text-anchor="middle">000000</text>
          <text id="odoUnit" x="800" y="472">mi</text>
        </g>
      </svg>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
